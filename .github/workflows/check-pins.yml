name: Check Recipe Download Pins

# Monthly: re-download every pinned artifact used by generated recipes, compare it with its
# pinned SHA-256, and flag pinned Alpine / Buildroot releases near or past end of support.
# A failed scheduled run emails whoever last changed this schedule; the job summary lists
# exactly which pins need updating in packages/core/src/generators/checksums.ts.
on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Pinned Downloads
        run: npm run check:pins
